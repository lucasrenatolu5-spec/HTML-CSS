<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible box</title>
    <style>
        div.container{
            background-color: lightcoral;
            display: flex;
            flex-flow: row wrap;
        }
        div.item{
            background-color: darkolivegreen;
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">conteudo maior</div>
        <div class="item">conteudo maior ainda </div>
        <div class="item">conteudo maior ainda, e vai crescendo</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
